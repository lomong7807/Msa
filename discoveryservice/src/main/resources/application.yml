server:
  port: 8761

spring:
  application:
    name: discoveryservice

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false

---

spring:
  config:
    activate:
      on-profile: eureka2

server:
  port: 8762

# 여기서 defaultZone 은 해당 서버에 등록돼있는 서비스를 공유하겠다는 설정
eureka:
  client:
    serviceUrl:
      defaultZone: http://sue:8763/eureka/
  instance:
    hostname: localhost

---

spring:
  config:
    activate:
      on-profile: eureka3

server:
  port: 8763

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8762/eureka/
  instance:
    hostname: sue